services:
  - type: web
    name: koogwe-admin
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        value: https://web-production-ba8e89.up.railway.app/api
      - key: VITE_SOCKET_URL
        value: https://web-production-ba8e89.up.railway.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
